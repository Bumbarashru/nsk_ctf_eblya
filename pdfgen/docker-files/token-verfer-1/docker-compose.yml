# Из корня репозитория:
#   docker compose -f docker-files/token-verfer-1/docker-compose.yml build
#   docker compose -f docker-files/token-verfer-1/docker-compose.yml up -d
#
services:
  token-verfer:
    build:
      context: ../..
      dockerfile: docker-files/token-verfer-1/Dockerfile
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      CHECKD_SIGNATURE_API_KEY: "change-me-please-long-random-key"
    volumes:
      # RSA-ключи между перезапусками (Main.java пишет в keys/)
      - token_verfer_keys:/app/keys

volumes:
  token_verfer_keys:
